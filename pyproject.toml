[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merakiops"
dynamic = ["version"]
description = 'Create, submit, and verify Meraki API action batches'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["meraki", "networking", "automation"]
authors = [
  { name = "Nathan Anderson", email = "nathanea05@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "merakisync",
]

[project.urls]
Documentation = "https://github.com/nathanea05/merakiops#readme"
Issues = "https://github.com/nathanea05/merakiops/issues"
Source = "https://github.com/nathanea05/merakiops"

[tool.hatch.version]
path = "src/merakiops/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/merakiops tests}"

[tool.coverage.run]
source_pkgs = ["merakiops", "tests"]
branch = true
parallel = true
omit = [
  "src/merakiops/__about__.py",
]

[tool.coverage.paths]
merakiops = ["src/merakiops", "*/merakiops/src/merakiops"]
tests = ["tests", "*/merakiops/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
